# =============================
# SPRINGDOC OPENAPI (SWAGGER)
# =============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.show-actuator=false
springdoc.swagger-ui.try-it-out-enabled=true

# Configuración para evitar conflictos con controladores de errores personalizados
springdoc.override-with-generic-response=false
springdoc.use-management-port=false
springdoc.show-login-endpoint=false

# spring.config.import=optional:file:.env[.properties]

# =============================
# VIRTUAL THREADS - Java 21
# =============================
spring.threads.virtual.enabled=true

# =============================
# OPTIMIZACIONES PARA VIRTUAL THREADS
# =============================
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100

# Configuración de conexión para alta concurrencia
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
