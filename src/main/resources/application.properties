# nombre de la aplicacion
spring.application.name=Chonect-N-1

# ruta global
# server.servlet.context-path=/api/v1
server.port=8080

# =============================
# CONFIGURACION BASE DE DATOS
# =============================

# Usar H2 para desarrollo local (base de datos en memoria)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Configuración alternativa para MySQL (comentada)
# spring.datasource.url=jdbc:mysql://localhost:3306/chonect-1
# spring.datasource.username=root
# spring.datasource.password=
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================
# CONFIGURACION JPA / HIBERNATE
# =============================

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# =============================
# H2 CONSOLE (para desarrollo)
# =============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================
# SPRING SECURITY (deshabilitado por defecto, ya manejas auth propia)
# =============================
spring.security.user.name=
spring.security.user.password=
# JWT secret key
security.jwt.secret-key=miClaveSecretaSuperSeguraDeAlMenos256BitsParaHS256AlgorithmQueEsMuyLargaYSegura
security.jwt.expiration-time=3600000

# =============================
# JAVA MAIL (para envio de correos)
# =============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=chonectenterprise@gmail.com
spring.mail.password=vmom jgxx dfsj qsup

# el correo es: chonectenterprise@gmail.com
# la contraseña es: chonectenterprise2025

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =============================
# SPRING GRAPHQL
# =============================
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.path=/graphql

# =============================
# SPRINGDOC OPENAPI (SWAGGER)
# =============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.show-actuator=false
springdoc.swagger-ui.try-it-out-enabled=true

# Configuración para evitar conflictos con controladores de errores personalizados
springdoc.override-with-generic-response=false
springdoc.use-management-port=false
springdoc.show-login-endpoint=false

