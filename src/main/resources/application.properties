# =============================
# SPRING GRAPHQL
# =============================
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.http.path=/graphql

# =============================
# SPRINGDOC OPENAPI (SWAGGER)
# =============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.show-actuator=false
springdoc.swagger-ui.try-it-out-enabled=true

# Configuración para evitar conflictos con controladores de errores personalizados
springdoc.override-with-generic-response=false
springdoc.use-management-port=false
springdoc.show-login-endpoint=false

spring.config.import=optional:file:.env[.properties]

# =============================
# VIRTUAL THREADS - Java 21
# =============================
spring.threads.virtual.enabled=true

# =============================
# OPTIMIZACIONES PARA VIRTUAL THREADS
# =============================
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100

# Configuración de conexión para alta concurrencia
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# Suprimir advertencia de Spring Security
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# =============================
# GRAPHQL LOGGING
# =============================
logging.level.org.springframework.graphql=DEBUG
logging.level.graphql=DEBUG

# Logging para tu aplicación (necesario para ver los logs de debug en GraphqlController)
logging.level.com.snapshot.chonect=DEBUG

# =============================
# COLORES EN CONSOLA
# =============================
# Habilitar colores ANSI en la consola
spring.output.ansi.enabled=ALWAYS

# Patrón de log con colores personalizados
# %clr = colorear según nivel de log
# ERROR = Rojo, WARN = Amarillo, INFO = Verde, DEBUG = Azul
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx

# =============================
# AUTO-CONFIGURATION DEBUG
# =============================
#debug=true
#logging.level.org.springframework.boot.autoconfigure=DEBUG

# =============================
# GRAPHQL SCHEMA CONFIGURATION
# =============================
spring.graphql.schema.locations=classpath:graphql/
spring.graphql.schema.file-extensions=.graphql
