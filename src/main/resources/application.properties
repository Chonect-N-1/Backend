# spring.h2.console.path=/h2-console

# =============================
# SPRING SECURITY (deshabilitado por defecto, ya manejas auth propia)
# =============================
spring.security.user.name=
spring.security.user.password=
# JWT configuration - hardcoded in the project
security.jwt.secret-key=bWlDbGF2ZVNlY3JldGFTdXBlclNlZ3VyYURlQWxNZW5vczI1NkJpdHNQYXJoczI1NkFsZ29yaXRoaFF1ZUVzTXV5TGFyZ2FZU2VndXJh
security.jwt.expiration-time=3600000

# =============================
# RESEND API - CONFIGURACIÓN PARA PRODUCCIÓN
# =============================
# API key de Resend para envío de emails via API REST
resend.api.key=${RESEND_API_KEY}

