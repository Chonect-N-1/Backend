<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Email</title>
    <style>
        /* Estilos para plantilla de verificación de email */
        .email-container {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
        }
        .email-title {
            color: #333;
        }
        .verification-code {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .code {
            font-size: 18px;
            font-weight: bold;
            color: #007bff;
        }
        .disclaimer {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <h2 class="email-title">¡Bienvenido a Chonect, <span th:text="${name}">Usuario</span>!</h2>
        <p>Gracias por registrarte en nuestra plataforma.</p>
        <p>Por favor ingresa el código de verificación para continuar:</p>

        <div class="verification-code">
            <h3>Código de verificación:</h3>
            <p class="code" th:text="${verificationCode}">123456</p>
        </div>

        <p>Si no solicitaste este registro, puedes ignorar este mensaje.</p>
        <p class="disclaimer">Este código expirará en 15 minutos.</p>
    </div>
</body>
</html>
