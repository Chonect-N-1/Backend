services:
  - type: web
    name: chonect-backend
    env: java
    # Usar imagen de Docker Hub en lugar de construir
    imageUrl: carrlox/chonect-backend:latest
    port: 8080
    healthCheckPath: /actuator/health
    autoDeploy: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        generateValue: true
      - key: SPRING_DATASOURCE_USERNAME
        generateValue: true
      - key: SPRING_DATASOURCE_PASSWORD
        generateValue: true
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.MySQLDialect
      # Variables para correo (Resend)
      - key: SPRING_MAIL_HOST
        value: smtp.resend.com
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        value: resend
      - key: SPRING_MAIL_PASSWORD
        value: re_Sv3QiaGU_3GqxUm32zVA4W1M97TJSrgUe
      - key: SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
        value: "true"
      - key: SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
        value: "true"
      - key: SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED
        value: "true"
